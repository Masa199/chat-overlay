<script>
    // Wpisz tu swoje dane
    const SUPABASE_URL = 'https://wkztgtxkyvknkproapdy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrenRndHhreXZrbmtwcm9hcGR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMTcwMzYsImV4cCI6MjA5OTg5MzAzNn0.cLwc-HEUmiduUatThWu92gfsCsqo0_mGEkdv5N2WctM';
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const chatDiv = document.getElementById('chat');
    
    // Zmienna do zapamiętywania ostatniego wiersza
    let lastId = 0;

    async function checkNewMessages() {
        try {
            // Pobieramy ostatni wpis z bazy
            const { data, error } = await supabase
                .from('chat')
                .select('*')
                .order('id', { ascending: false })
                .limit(1);

            if (data && data.length > 0) {
                const latest = data[0];
                
                // Jeśli ID w bazie jest większe niż to, które mamy, to znaczy, że jest coś nowego
                if (latest.id > lastId) {
                    lastId = latest.id;
                    const div = document.createElement('div');
                    div.className = 'message';
                    div.textContent = latest.text;
                    chatDiv.appendChild(div);
                    chatDiv.scrollTop = chatDiv.scrollHeight;
                }
            }
        } catch (e) {
            console.error("Błąd odczytu:", e);
        }
    }

    // Uruchamiamy sprawdzanie co 2 sekundy
    setInterval(checkNewMessages, 2000);
</script>
