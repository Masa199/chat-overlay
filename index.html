<html>
<head>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <title>Czat Supabase</title>
    <style>
        /* TU ZMIENIAMY WYGLĄD */
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; }
        #chat { border: 1px solid #ddd; height: 400px; overflow-y: scroll; padding: 15px; border-radius: 8px; background: #f9f9f9; }
        .message { padding: 8px; margin-bottom: 8px; background: white; border-radius: 5px; border: 1px solid #eee; }
        #status { margin-bottom: 10px; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>

    <div id="status">Łączenie z bazą...</div>
    <div id="chat"></div>

    <script>
        const SUPABASE_URL = 'https://wkztgtxkyvknkproapdy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrenRndHhreXZrbmtwcm9hcGR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMTcwMzYsImV4cCI6MjA5OTg5MzAzNn0.cLwc-HEUmiduUatThWu92gfsCsqo0_mGEkdv5N2WctM';
        
        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const statusDiv = document.getElementById('status');
        const chatDiv = document.getElementById('chat');

        async function pobierzDane() {
            const { data, error } = await sbClient
                .from('chat')
                .select('*')
                .order('id', { ascending: false })
                .limit(20);

            if (error) {
                statusDiv.innerText = "BŁĄD: " + error.message;
            } else {
                statusDiv.innerText = "Twoje wiadomości:";
                chatDiv.innerHTML = ""; 
                data.reverse().forEach(row => {
                    const p = document.createElement('div');
                    p.className = 'message';
                    p.innerText = row.text;
                    chatDiv.appendChild(p);
                });
                chatDiv.scrollTop = chatDiv.scrollHeight;
            }
        }

        pobierzDane();
    </script>
</body>
</html>
