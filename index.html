<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Live Chat Overlay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            font-family: 'Segoe UI', sans-serif;
            font-size: 28px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column-reverse;
            padding: 20px;
        }
        #chat {
            display: flex;
            flex-direction: column-reverse;
            gap: 12px;
            max-height: 100vh;
            overflow-y: auto;
            padding: 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #chat::-webkit-scrollbar { display: none; }
        .message {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            padding: 16px 24px;
            border-radius: 18px;
            border-left: 6px solid #00d4ff;
            animation: fadeIn 0.35s ease;
            word-wrap: break-word;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            font-weight: 500;
            letter-spacing: 0.3px;
            line-height: 1.4;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="chat"></div>

    <script>
        // TUTAJ WKLEJ TEN SAM LINK CO W SKRYPCIE NODE.JS (Z /chat.json NA KOŃCU)
        const FIREBASE_URL = 'TUTAJ_WKLEJ_SWOJ_LINK_Z_FIREBASE/chat.json';
        const chatDiv = document.getElementById('chat');

        function connectToFirebase() {
            const eventSource = new EventSource(FIREBASE_URL, {
                headers: { 'Accept': 'text/event-stream' }
            });

            eventSource.addEventListener('put', (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data && data.data && data.data.text) {
                        createMessageElement(data.data.text);
                    }
                } catch (e) {
                    console.error("Błąd:", e);
                }
            });

            eventSource.onerror = () => {
                eventSource.close();
                setTimeout(connectToFirebase, 2000);
            };
        }

        function createMessageElement(text) {
            const div = document.createElement('div');
            div.className = 'message';
            div.textContent = text;
            chatDiv.insertBefore(div, chatDiv.firstChild);
            while (chatDiv.children.length > 40) {
                chatDiv.removeChild(chatDiv.lastChild);
            }
        }

        connectToFirebase();
    </script>
</body>
</html>
