<html>
<head>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <title>Czat Supabase</title>
</head>
<body>

    <div id="status">Łączenie z bazą...</div>
    <div id="chat"></div>

    <script>
        // 1. WPISZ SWOJE DANE PONIŻEJ
        const SUPABASE_URL = 'WKLEJ_TU_SWOJ_URL';
        const SUPABASE_KEY = 'WKLEJ_TU_SWOJ_ANON_KEY';
        
        // 2. Inicjalizacja z nazwą 'sbClient' (żeby nie było błędu z nazwą)
        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        const statusDiv = document.getElementById('status');
        const chatDiv = document.getElementById('chat');

        async function pobierzDane() {
            try {
                // 3. Używamy 'sbClient' zamiast 'supabase'
                const { data, error } = await sbClient
                    .from('chat')
                    .select('*')
                    .order('id', { ascending: false })
                    .limit(5);

                if (error) {
                    statusDiv.innerText = "BŁĄD: " + error.message;
                    console.error("Szczegóły błędu:", error);
                } else {
                    statusDiv.innerText = "Połączono! Ostatnie wiadomości:";
                    chatDiv.innerHTML = ""; 
                    if (data && data.length > 0) {
                        data.forEach(row => {
                            const p = document.createElement('p');
                            p.innerText = row.text;
                            chatDiv.appendChild(p);
                        });
                    } else {
                        statusDiv.innerText = "Połączono, ale tabela jest pusta.";
                    }
                }
            } catch (err) {
                statusDiv.innerText = "Błąd krytyczny: " + err.message;
            }
        }

        pobierzDane();
    </script>
</body>
</html>
