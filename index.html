<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Live Chat Overlay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        #chat { display: flex; flex-direction: column; gap: 6px; height: 100%; overflow-y: scroll; scrollbar-width: none; }
        #chat::-webkit-scrollbar { display: none; }
        .message { background: rgba(0, 0, 0, 0.75); padding: 8px 14px; border-radius: 10px; border-left: 4px solid #00d4ff; animation: fadeIn 0.25s ease forwards; color: #ffffff; font-size: 20px; margin-bottom: 5px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="chat"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'WKLEJ_TU_SWOJ_URL';
        const SUPABASE_KEY = 'WKLEJ_TU_SWOJ_ANON_KEY';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const chatDiv = document.getElementById('chat');

        // Nasłuchiwanie zmian w tabeli 'chat'
        supabase.channel('public:chat')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat' }, payload => {
                const div = document.createElement('div');
                div.className = 'message';
                div.textContent = payload.new.text;
                chatDiv.appendChild(div);
                chatDiv.scrollTop = chatDiv.scrollHeight;
                if (chatDiv.children.length > 50) chatDiv.removeChild(chatDiv.firstChild);
            })
            .subscribe();
    </script>
</body>
</html>
